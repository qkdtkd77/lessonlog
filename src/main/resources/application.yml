spring:
  application:
    name: lessonlog
  profiles:
    default: local
  jpa:
    open-in-view: false
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
server:
  tomcat:
    mbeanregistry:
      enabled: true
